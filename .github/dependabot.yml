version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 99
    groups:
      babel:
        applies-to: version-updates
        patterns:
          - "@babel/*"
      ember-data:
        applies-to: version-updates
        patterns:
          - "ember-data*"
          - "@ember-data/*"
          - "@warp-drive/*"
      embroider:
        applies-to: version-updates
        patterns:
          - "@embroider/*"
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "@eslint/*"
      qunit:
        applies-to: version-updates
        patterns:
          - "qunit*"
          - "@types/qunit"
          - "ember-qunit"
      stylelint:
        applies-to: version-updates
        patterns:
          - "stylelint*"
      tailwindcss:
        applies-to: version-updates
        patterns:
          - "@tailwindcss/*"
          - "tailwindcss*"
      typescript:
        applies-to: version-updates
        patterns:
          - "@tsconfig/*"
          - "typescript*"
    reviewers:
      - kpfefferle
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    reviewers:
      - kpfefferle

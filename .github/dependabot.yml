version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    groups:
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "eslint-plugin-svelte"
          - "prettier-plugin-svelte"
      vite:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
      playwright:
        applies-to: version-updates
        patterns:
          - "playwright"
          - "@playwright/*"
      prettier:
        applies-to: version-updates
        patterns:
          - "prettier"
      stylelint:
        applies-to: version-updates
        patterns:
          - "stylelint*"
      tailwindcss:
        applies-to: version-updates
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
      typescript:
        applies-to: version-updates
        patterns:
          - "@tsconfig/*"
          - "typescript*"
    assignees:
      - kpfefferle
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - kpfefferle

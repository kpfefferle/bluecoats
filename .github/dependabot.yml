version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "daily"
    open-pull-requests-limit: 15
    # Wait for releases to age past pnpm's ~24h minimumReleaseAge supply-chain
    # policy before opening PRs, so fresh bumps don't fail CI on install.
    cooldown:
      default-days: 2
    groups:
      eslint:
        applies-to: version-updates
        patterns:
          - "eslint*"
          - "@eslint/*"
          - "typescript-eslint"
      svelte:
        applies-to: version-updates
        patterns:
          - "svelte"
          - "svelte-check"
          - "@sveltejs/*"
          - "eslint-plugin-svelte"
          - "prettier-plugin-svelte"
      vite:
        applies-to: version-updates
        patterns:
          - "vite"
          - "vitest"
          - "@vitest/*"
      playwright:
        applies-to: version-updates
        patterns:
          - "playwright"
          - "@playwright/*"
      prettier:
        applies-to: version-updates
        patterns:
          - "prettier"
      stylelint:
        applies-to: version-updates
        patterns:
          - "stylelint*"
      tailwindcss:
        applies-to: version-updates
        patterns:
          - "tailwindcss*"
          - "@tailwindcss/*"
          - "prettier-plugin-tailwindcss"
      typescript:
        applies-to: version-updates
        patterns:
          - "@tsconfig/*"
          - "typescript*"
    assignees:
      - kpfefferle
  - package-ecosystem: "github-actions"
    # Workflow files stored in the
    # default location of `.github/workflows`
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    assignees:
      - kpfefferle

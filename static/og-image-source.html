<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        width: 1200px;
        height: 630px;
        background: #0a1531;
        font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
        color: #ffffff;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 96px;
        position: relative;
      }
      .bar {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 12px;
        background: linear-gradient(90deg, #2f6cff 0%, #e0b65a 100%);
      }
      .eyebrow {
        font-size: 28px;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: #9ab8ff;
        margin-bottom: 24px;
      }
      h1 {
        font-size: 104px;
        font-weight: 800;
        line-height: 1.02;
        letter-spacing: -0.02em;
      }
      p {
        margin-top: 32px;
        font-size: 40px;
        font-weight: 500;
        color: #e6efff;
      }
      .domain {
        position: absolute;
        bottom: 64px;
        left: 96px;
        font-size: 28px;
        color: #5b8bff;
        font-weight: 600;
      }
    </style>
  </head>
  <body>
    <div class="bar"></div>
    <div class="eyebrow">Drum Corps International</div>
    <h1>Bluecoats Scores</h1>
    <p>DCI score history &amp; daily rankings</p>
    <div class="domain">bluecoatsscores.com</div>
  </body>
</html>
